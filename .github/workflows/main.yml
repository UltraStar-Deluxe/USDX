name: Build

on:
  push:
    branches:
      - master
  pull_request:
  # Run every day at 5:40.
  schedule:
    - cron:  '40 5 * * *'
jobs:
  build_windows:
    name: Build for Windows
    runs-on: windows-2022
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Determine version
        run: |
          $VNAME=$(cat VERSION | sed "s/+dev$/+dev-$(git rev-parse --short HEAD)/")
          echo "versionName=$VNAME" >> $env:GITHUB_ENV
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: false
          install: >-
            autoconf-wrapper
            automake-wrapper
            git
            make
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-tools
      - name: Install Dependencies
        run: |
          curl.exe -L --max-time 60 -o fpc-installer.exe "https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download"
          curl.exe -L --max-time 60 -o nsis-3.05-setup.exe "https://sourceforge.net/projects/nsis/files/NSIS%203/3.05/nsis-3.05-setup.exe/download"
          Start-Process -FilePath ".\\fpc-installer.exe" -ArgumentList "/TYPE=full /VERYSILENT /SP- /SUPPRESSMSGBOXES /NORESTART" -Wait
          ./nsis-3.05-setup.exe /S
      - name: Download prebuilt DLLs
        run: |
          python dldlls.py
          7z x -y usdx-dlls-x86_64.zip -ogame "*.dll"
          7z x -y usdx-dlls-x86_64.zip -osrc "config-win.inc"
        env:
          ARTIFACT_ACCESS_TOKEN: ${{ secrets.MxeActionsReadAccessToken }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        shell: msys2 {0}
        run: |
          export PATH="/usr/bin:/mingw64/bin:/c/FPC/3.2.2/bin:/c/FPC/3.2.2/bin/i386-win32:$PATH"
          export MAKE="/usr/bin/make"
          export FPCCFG="/c/FPC/3.2.2/bin/i386-win32/fpc.cfg"
          export FPCDIR="/c/FPC/3.2.2"
          export FPCMAKE="/c/FPC/3.2.2/bin/i386-win32/fpcmake"
          ./autogen.sh
          ./configure
          make
      - name: Create installer
        run: |
          del game\*.debug
          xcopy game\*.dll installer\dependencies\dll /y
          & 'C:\Program Files (x86)\NSIS\makensis.exe' "installer/UltraStar Deluxe.nsi"
          mv installer\dist\UltraStar.Deluxe_*_installer.exe UltraStarDeluxe-windows-installer-${{ env.versionName }}.exe
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v6
        with:
          name: UltraStarDeluxe-windows-installer-${{ env.versionName }}
          path: UltraStarDeluxe-windows-installer-${{ env.versionName }}.exe
          if-no-files-found: error
      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v6
        with:
          name: UltraStarDeluxe-windows-portable-${{ env.versionName }}
          path: game
          if-no-files-found: error

  build_mac:
    name: Build for MacOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    env:
      SDL3_VERSION: 3.4.14
      SDL3_SHA: 30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb
      SDL2_COMPAT_VERSION: 2.32.70
      SDL2_COMPAT_SHA: 998fa62557eb46ffe7e5c3e2c123bc332f7df9d9f593b3ceed88ed1158428a44
      SDL2_IMAGE_VERSION: 2.8.12
      SDL2_IMAGE_SHA: 393f5efb50536ec13ca4f4affb69cc9966d3c3f969e6c5e701faddf9f9785381
      SDL_MACOS_DEPLOYMENT_TARGET: 11.0
      MACOS_EXTRA_DYLIBS: ${{ github.workspace }}/sdl2/lib/libSDL3.dylib
      PROJECTM_VERSION: 4.1.7
      PROJECTM_SHA: 16e4610b4d58981f7a2351faa58d507d3f40163a7b26ba81e19aec928c66641f
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Determine version
        run: |
          VNAME=$(cat VERSION | sed "s/+dev$/+dev-$(git rev-parse --short HEAD)/")
          echo "versionName=$VNAME" >> $GITHUB_ENV
      - name: Determine Arch
        run: |
          if [ "${{ matrix.os }}" = "macos-15-intel" ]; then
            echo "arch=x86" >> $GITHUB_ENV
          else
            echo "arch=ARM" >> $GITHUB_ENV
          fi
      - name: Install Homebrew Dependencies
        run: |
          brew install fpc automake portaudio lua ffmpeg opencv

      - name: Cache SDL libraries
        id: cache-sdl
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/sdl2
          key: sdl-${{matrix.os}}-${{env.SDL3_VERSION}}-${{env.SDL2_COMPAT_VERSION}}-${{env.SDL2_IMAGE_VERSION}}-macos-${{env.SDL_MACOS_DEPLOYMENT_TARGET}}
      - name: Build SDL libraries
        if: steps.cache-sdl.outputs.cache-hit != 'true'
        run: |
          curl -L -O https://github.com/libsdl-org/SDL/releases/download/release-$SDL3_VERSION/SDL3-$SDL3_VERSION.tar.gz
          echo "$SDL3_SHA SDL3-$SDL3_VERSION.tar.gz" | sha256sum -c -
          tar -xf SDL3-$SDL3_VERSION.tar.gz
          cmake -S SDL3-$SDL3_VERSION \
            -B SDL3-$SDL3_VERSION/build \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$SDL_MACOS_DEPLOYMENT_TARGET \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl2 \
            -DCMAKE_INSTALL_NAME_DIR=$GITHUB_WORKSPACE/sdl2/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build SDL3-$SDL3_VERSION/build --target install --parallel

          curl -L -O https://github.com/libsdl-org/sdl2-compat/releases/download/release-$SDL2_COMPAT_VERSION/sdl2-compat-$SDL2_COMPAT_VERSION.tar.gz
          echo "$SDL2_COMPAT_SHA sdl2-compat-$SDL2_COMPAT_VERSION.tar.gz" | sha256sum -c -
          tar -xf sdl2-compat-$SDL2_COMPAT_VERSION.tar.gz
          cmake -S sdl2-compat-$SDL2_COMPAT_VERSION \
            -B sdl2-compat-$SDL2_COMPAT_VERSION/build \
            -DSDL2COMPAT_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$SDL_MACOS_DEPLOYMENT_TARGET \
            -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/sdl2 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl2 \
            -DCMAKE_INSTALL_NAME_DIR=$GITHUB_WORKSPACE/sdl2/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build sdl2-compat-$SDL2_COMPAT_VERSION/build --target install --parallel

          curl -L -O https://github.com/libsdl-org/SDL_image/releases/download/release-$SDL2_IMAGE_VERSION/SDL2_image-$SDL2_IMAGE_VERSION.tar.gz
          echo "$SDL2_IMAGE_SHA SDL2_image-$SDL2_IMAGE_VERSION.tar.gz" | sha256sum -c -
          tar -xf SDL2_image-$SDL2_IMAGE_VERSION.tar.gz
          cmake -S SDL2_image-$SDL2_IMAGE_VERSION \
            -B SDL2_image-$SDL2_IMAGE_VERSION/build \
            -DBUILD_SHARED_LIBS=ON \
            -DSDL2IMAGE_SAMPLES=OFF \
            -DSDL2IMAGE_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$SDL_MACOS_DEPLOYMENT_TARGET \
            -DCMAKE_PREFIX_PATH=$GITHUB_WORKSPACE/sdl2 \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl2 \
            -DCMAKE_INSTALL_NAME_DIR=$GITHUB_WORKSPACE/sdl2/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DSDL2_DIR=$GITHUB_WORKSPACE/sdl2/lib/cmake/SDL2
          cmake --build SDL2_image-$SDL2_IMAGE_VERSION/build --target install --parallel
      - name: Cache ProjectM
        id: cache-projectm
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/projectm
          key: projectm-${{matrix.os}}-${{env.PROJECTM_VERSION}}
      - name: Build ProjectM
        if: steps.cache-projectm.outputs.cache-hit != 'true'
        run: |
          curl -L -O https://github.com/projectM-visualizer/projectm/releases/download/v$PROJECTM_VERSION/libprojectM-$PROJECTM_VERSION.tar.gz
          echo "$PROJECTM_SHA libprojectM-$PROJECTM_VERSION.tar.gz" | sha256sum -c -
          tar -xf libprojectM-$PROJECTM_VERSION.tar.gz
          cmake -S libprojectM-$PROJECTM_VERSION \
            -B libprojectM-$PROJECTM_VERSION/build \
            -DENABLE_PLAYLIST=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/projectm \
            -DCMAKE_INSTALL_NAME_DIR=$GITHUB_WORKSPACE/projectm/lib \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          cmake --build libprojectM-$PROJECTM_VERSION/build --target install --parallel
      - name: Generate Build Scripts
        run: ./autogen.sh
      - name: Configure Project
        run: |
          PKG_CONFIG_PATH=$GITHUB_WORKSPACE/sdl2/lib/pkgconfig \
          libprojectM_VERSION=$PROJECTM_VERSION \
          LIBS=-L$GITHUB_WORKSPACE/projectm/lib \
          ./configure --with-opencv-cxx-api --with-libprojectM=nocheck
      - name: Build
        run: make macos-dmg
      - name: Rename DMG
        run: mv UltraStarDeluxe.dmg UltraStarDeluxe-mac-${{ env.arch }}-${{ env.versionName }}.dmg
      - name: Verify packaged SDL libraries
        run: |
          dmg="UltraStarDeluxe-mac-${{ env.arch }}-${{ env.versionName }}.dmg"
          mount_point="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rmdir "$mount_point" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          bundle_macos_dir="$mount_point/UltraStarDeluxe.app/Contents/MacOS"

          test -f "$bundle_macos_dir/libSDL2-2.0.0.dylib"
          test -f "$bundle_macos_dir/libSDL3.dylib"
          otool -L "$bundle_macos_dir/ultrastardx" | grep '@executable_path/libSDL2-2.0.0.dylib'
          otool -D "$bundle_macos_dir/libSDL3.dylib" | grep '@executable_path/libSDL3.dylib'
          vtool -show-build "$bundle_macos_dir/libSDL3.dylib" | grep "minos $SDL_MACOS_DEPLOYMENT_TARGET"
          BUNDLE_MACOS_DIR="$bundle_macos_dir" python3 - <<'PY'
          import ctypes
          import os

          bundle_macos_dir = os.environ["BUNDLE_MACOS_DIR"]
          bundled_sdl3 = os.path.realpath(os.path.join(bundle_macos_dir, "libSDL3.dylib"))

          dyld = ctypes.CDLL(None)
          dyld._dyld_image_count.argtypes = []
          dyld._dyld_image_count.restype = ctypes.c_uint32
          dyld._dyld_get_image_name.argtypes = [ctypes.c_uint32]
          dyld._dyld_get_image_name.restype = ctypes.c_char_p

          def loaded_sdl3_paths():
              paths = set()
              for image_index in range(dyld._dyld_image_count()):
                  image_name = dyld._dyld_get_image_name(image_index)
                  if image_name:
                      image_path = os.path.realpath(os.fsdecode(image_name))
                      if os.path.basename(image_path) == "libSDL3.dylib":
                          paths.add(image_path)
              return sorted(paths)

          preloaded_sdl3 = loaded_sdl3_paths()
          if preloaded_sdl3:
              raise RuntimeError(f"SDL3 was already loaded before the test: {preloaded_sdl3}")

          sdl2 = ctypes.CDLL(os.path.join(bundle_macos_dir, "libSDL2-2.0.0.dylib"))
          sdl2.SDL_Init.argtypes = [ctypes.c_uint32]
          sdl2.SDL_Init.restype = ctypes.c_int
          sdl2.SDL_Quit.argtypes = []
          sdl2.SDL_Quit.restype = None
          if sdl2.SDL_Init(0) != 0:
              raise RuntimeError("SDL_Init failed through sdl2-compat")

          loaded_sdl3 = loaded_sdl3_paths()
          print(f"Expected bundled SDL3: {bundled_sdl3}")
          print(f"Loaded SDL3 images: {loaded_sdl3}")

          sdl2.SDL_Quit()

          if loaded_sdl3 != [bundled_sdl3]:
              raise RuntimeError(
                  f"sdl2-compat did not load the bundled SDL3; loaded paths: {loaded_sdl3}"
              )
          PY
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: UltraStarDeluxe-mac-${{ env.arch }}-${{ env.versionName }}
          path: UltraStarDeluxe-mac-${{ env.arch }}-${{ env.versionName }}.dmg
          if-no-files-found: error

  build_linux:
    name: Build for Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Determine version
        run: |
          VNAME=$(cat VERSION | sed "s/+dev$/+dev-$(git rev-parse --short HEAD)/")
          echo "versionName=$VNAME" >> $GITHUB_ENV
      - name: Cache build
        uses: actions/cache@v5
        with:
          key: linux-docker-${{ hashFiles('dists/linux/dl.sh', 'dists/linux/tasks.sh', 'dists/linux/dockerenv.sh', 'dists/linux/Dockerfile.in') }}
          path: |
            dists/linux/prefix
      - name: Start container builder
        uses: docker/setup-buildx-action@v4
      - name: Generate Dockerfile
        run: |
          cd dists/linux
          ./dockerenv.sh --dockerfile > Dockerfile
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: dists/linux
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          load: true
          tags: usdx/buildenv:latest
      - name: Build
        run: |
          cd dists/linux
          sed -i '/docker/s/-it\>//' dockerenv.sh
          ./dockerenv.sh --use-existing=usdx/buildenv:latest make compress
          mv UltraStar*.AppImage ../../UltraStarDeluxe-linux-${{ env.versionName }}.AppImage
      - name: Upload Image Artifact
        uses: actions/upload-artifact@v6
        with:
          name: UltraStarDeluxe-linux-${{ env.versionName }}
          path: UltraStarDeluxe-linux-${{ env.versionName }}.AppImage
          if-no-files-found: error
