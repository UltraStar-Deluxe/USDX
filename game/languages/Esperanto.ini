ABOUT_USDX_CREDITS=Kreditoj
ABOUT_OVERVIEW=UltraStar Deluxe estas senpaga malfermfonta karaoke-ludo por via komputilo. La lud-sperto similas al tiu de la komerca produkto SingStar™ de Sony Computer Entertainment, kiu estas ekskluzive disponebla por Playstation®. Male al SingStar™, UltraStar Deluxe permesas al uzantoj krei siajn proprajn kantojn kaj kanti ilin per sia komputilo.\nPublikigante la fontkodon, ni ebligis al vi tute agordi la ludon laŭ viaj deziroj, bezonoj kaj preferoj.\nPrecipe, vi rajtas modifi la produkton laŭplaĉe.\n\nKreu viajn proprajn temojn aŭ elŝutu enhavon de la komunumo, kiel kromprogramojn, senpagajn kantojn aŭ kodflikaĵojn por aldoni funkciojn.\nEn Party-reĝimo ĝis dek du ludantoj povas kanti kune laŭ via plej ŝatata muziko por gajni poentarojn, depende de la tono de la voĉo kaj de la ritmo de la kantado.
