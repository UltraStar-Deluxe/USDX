ABOUT_OVERVIEW=UltraStar Deluxe er ókeypis karaókíleikur með opnum frumkóða fyrir tölvuna þína. Leikjaupplifunin er svipuð og í auglýsingavörunni SingStar™ frá Sony Computer Entertainment, sem er eingöngu fáanleg fyrir Playstation®. Ólíkt SingStar™ gerir UltraStar Deluxe notendum hins vegar kleift að búa til eigin lög og syngja þau á tölvunni sinni.\nMeð því að birta frumkóðann höfum við gert þér kleift að sérsníða leikinn algjörlega eftir þínum óskum, þörfum og sérstökum kröfum.\nÞú getur sérstaklega breytt vörunni eins og þú vilt.\n\nBúðu til þín eigin þemu eða halaðu niður efni frá samfélaginu, svo sem viðbótum, ókeypis lögum eða kóðaplástrum sem bæta við nýjum eiginleikum.\nÍ partístillingu geta allt að tólf leikmenn sungið með uppáhaldstónlistinni þinni og fengið stig eftir tónhæð raddarinnar og taktinum í söngnum.
