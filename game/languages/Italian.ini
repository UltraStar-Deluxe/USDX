ABOUT_OVERVIEW=UltraStar Deluxe è un gioco di karaoke gratuito e open source per PC. L'esperienza di gioco è simile a quella del prodotto commerciale SingStar™ di Sony Computer Entertainment, disponibile in esclusiva per Playstation®. A differenza di SingStar™, tuttavia, UltraStar Deluxe permette agli utenti di creare le proprie canzoni e cantarle sul proprio PC.\nPubblicando il codice sorgente, ti abbiamo permesso di personalizzare completamente il gioco secondo i tuoi gusti, desideri ed esigenze specifiche.\nIn particolare, puoi modificare il prodotto come preferisci.\n\nCrea i tuoi temi o scarica contenuti dalla comunità, come plugin, canzoni gratuite o patch del codice per aggiungere nuove funzionalità.\nIn modalità party puoi far cantare fino a dodici giocatori sulle tue canzoni preferite, assegnando punti in base all'intonazione della voce e al ritmo del canto.
